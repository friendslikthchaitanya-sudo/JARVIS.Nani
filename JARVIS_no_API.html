<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #050b14;
    color: white;
    height: 100vh;
    overflow: hidden;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ================= HEADER ================= */

.header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 15px;
    background: rgba(10,20,35,0.95);
    border-bottom: 1px solid #183b60;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.orb-small {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #36a9ff 25%, #006eff 60%, #001b45 100%);
    box-shadow:
        0 0 10px #008cff,
        0 0 25px #006eff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.08);
    }
}

.title {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 3px;
}

.status {
    color: #35d8ff;
    font-size: 11px;
    margin-top: 3px;
}

.settings-btn {
    width: 45px;
    height: 45px;
    border: 1px solid #245b89;
    border-radius: 50%;
    background: #0c1c2d;
    color: white;
    font-size: 21px;
}

/* ================= CHAT ================= */

#chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 18px 12px 130px;
    scroll-behavior: smooth;
}

.message {
    display: flex;
    margin: 10px 0;
}

.message.user {
    justify-content: flex-end;
}

.message.jarvis {
    justify-content: flex-start;
}

.bubble {
    max-width: 85%;
    padding: 12px 15px;
    border-radius: 17px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.user .bubble {
    background: #0865d9;
    border-bottom-right-radius: 4px;
}

.jarvis .bubble {
    background: #102235;
    border: 1px solid #1c496e;
    border-bottom-left-radius: 4px;
}

.time {
    font-size: 9px;
    opacity: 0.5;
    margin-top: 5px;
    text-align: right;
}

/* ================= TYPING ================= */

.typing {
    display: flex;
    gap: 5px;
    padding: 5px;
}

.typing span {
    width: 7px;
    height: 7px;
    background: #42bfff;
    border-radius: 50%;
    animation: typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    50% {
        opacity: .2;
        transform: translateY(-3px);
    }
}

/* ================= BOTTOM ================= */

.bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(5,12,22,.97);
    border-top: 1px solid #173d5e;
    padding: 8px;
    z-index: 20;
}

.controls {
    display: flex;
    gap: 7px;
    margin-bottom: 8px;
}

.control-btn {
    flex: 1;
    padding: 9px 5px;
    border-radius: 10px;
    border: 1px solid #23557e;
    background: #0c1c2c;
    color: white;
    font-size: 12px;
}

.input-area {
    display: flex;
    gap: 7px;
}

#userInput {
    flex: 1;
    min-width: 0;
    border: 1px solid #245b89;
    background: #0c1a29;
    color: white;
    border-radius: 13px;
    padding: 12px;
    outline: none;
}

#userInput:focus {
    border-color: #199cff;
}

.send-btn {
    width: 50px;
    border: none;
    border-radius: 13px;
    background: #0878ee;
    color: white;
    font-size: 22px;
}

/* ================= SETTINGS ================= */

.settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 100;
}

.settings-overlay.show {
    display: flex;
}

.settings-panel {
    width: 100%;
    max-width: 430px;
    max-height: 90vh;
    overflow-y: auto;
    background: #0b1828;
    border: 1px solid #27618e;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 0 35px rgba(0,130,255,.25);
}

.settings-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.settings-title h2 {
    font-size: 19px;
}

.close-settings {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #355d7c;
    background: #122438;
    color: white;
    font-size: 18px;
}

.setting {
    padding: 15px 0;
    border-bottom: 1px solid #18344d;
}

.setting-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.setting-desc {
    color: #91a8ba;
    font-size: 12px;
    margin-bottom: 10px;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

input[type="checkbox"] {
    width: 22px;
    height: 22px;
}

input[type="range"] {
    width: 100%;
}

select {
    width: 100%;
    background: #101f30;
    color: white;
    border: 1px solid #28587e;
    padding: 10px;
    border-radius: 9px;
}

.test-voice-btn,
.danger-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
    color: white;
}

.test-voice-btn {
    border: 1px solid #2373a9;
    background: #0d3857;
}

.danger-btn {
    border: 1px solid #8a3434;
    background: #4c1717;
}

/* ================= ERROR ================= */

#errorBox {
    position: fixed;
    left: 10px;
    right: 10px;
    top: 80px;
    background: #561c1c;
    border: 1px solid #ff5555;
    color: white;
    padding: 12px;
    border-radius: 10px;
    display: none;
    z-index: 200;
    font-size: 12px;
}

/* ================= MOBILE ================= */

@media (max-width: 400px) {
    .title {
        font-size: 18px;
    }

    .control-btn {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">

            <div class="orb-small"></div>

            <div>
                <div class="title">JARVIS</div>
                <div class="status" id="status">
                    ONLINE • READY
                </div>
            </div>

        </div>

        <button
            type="button"
            class="settings-btn"
            id="settingsBtn">
            ⚙️
        </button>

    </header>


    <!-- CHAT -->
    <main id="chatBox"></main>


    <!-- BOTTOM -->
    <div class="bottom">

        <div class="controls">

            <button
                type="button"
                class="control-btn"
                id="voiceButton">
                🔊 Voice ON
            </button>

            <button
                type="button"
                class="control-btn"
                id="stopButton">
                🔇 Stop
            </button>

            <button
                type="button"
                class="control-btn"
                id="clearButton">
                🗑 Clear
            </button>

        </div>


        <div class="input-area">

            <input
                id="userInput"
                type="text"
                autocomplete="off"
                placeholder="Talk to JARVIS...">

            <button
                type="button"
                class="send-btn"
                id="sendButton">
                ➤
            </button>

        </div>

    </div>

</div>


<!-- SETTINGS -->

<div
    class="settings-overlay"
    id="settingsOverlay">

    <div class="settings-panel">

        <div class="settings-title">

            <h2>⚙️ JARVIS Settings</h2>

            <button
                type="button"
                class="close-settings"
                id="closeSettingsBtn">
                ✕
            </button>

        </div>


        <!-- VOICE -->

        <div class="setting">

            <div class="setting-title">
                🔊 Voice
            </div>

            <div class="setting-desc">
                Enable or disable JARVIS voice responses.
            </div>

            <div class="setting-row">

                <span>Voice enabled</span>

                <input
                    type="checkbox"
                    id="voiceToggle"
                    checked>

            </div>

        </div>


        <!-- SPEED -->

        <div class="setting">

            <div class="setting-title">
                ⚡ Voice Speed
            </div>

            <div class="setting-desc">
                Adjust JARVIS speaking speed.
            </div>

            <input
                type="range"
                id="voiceSpeed"
                min="0.5"
                max="1.5"
                step="0.05"
                value="0.95">

            <div id="voiceSpeedValue">
                0.95x
            </div>

        </div>


        <!-- LANGUAGE -->

        <div class="setting">

            <div class="setting-title">
                🌐 Voice Language
            </div>

            <div class="setting-desc">
                Choose the speech language.
            </div>

            <select id="voiceLanguage">

                <option value="en-IN">
                    English India
                </option>

                <option value="en-US">
                    English USA
                </option>

                <option value="en-GB">
                    English UK
                </option>

                <option value="hi-IN">
                    Hindi
                </option>

                <option value="te-IN">
                    Telugu
                </option>

            </select>

        </div>


        <!-- MEMORY -->

        <div class="setting">

            <div class="setting-title">
                🧠 Memory
            </div>

            <div class="setting-desc">
                Save conversations in this browser.
            </div>

            <div class="setting-row">

                <span>Memory enabled</span>

                <input
                    type="checkbox"
                    id="memoryToggle"
                    checked>

            </div>

        </div>


        <!-- TEST VOICE -->

        <button
            type="button"
            class="test-voice-btn"
            id="testVoiceButton">

            ▶ Test JARVIS Voice

        </button>


        <!-- CLEAR MEMORY -->

        <button
            type="button"
            class="danger-btn"
            id="clearMemoryButton">

            🗑️ Clear JARVIS Memory

        </button>

    </div>

</div>


<div id="errorBox"></div>


<script>
/* =========================================================
   JARVIS AI
   ========================================================= */


/* ================= GEMINI CONFIG ================= */

/*
   PASTE YOUR GEMINI API KEY BELOW.

   Example:

   const API_KEY = "";

   DO NOT SHARE YOUR API KEY WITH OTHER PEOPLE.
*/

const API_KEY = "";

const MODEL = "gemini-3.6-flash";


/* ================= GLOBAL VARIABLES ================= */

let conversation = [];

let voiceEnabled = true;

let voiceSpeed = 0.95;

let voiceLanguage = "en-IN";

let memoryEnabled = true;

const MEMORY_KEY = "jarvisConversation";

let typingElement = null;


/* ================= DOM READY ================= */

document.addEventListener("DOMContentLoaded", function () {

    console.log("JARVIS JavaScript started");

    setupButtons();

    loadSettings();

    loadMemory();

    showWelcomeMessage();

});


/* ================= BUTTON SETUP ================= */

function setupButtons() {

    const settingsBtn =
        document.getElementById("settingsBtn");

    const closeSettingsBtn =
        document.getElementById("closeSettingsBtn");

    const voiceButton =
        document.getElementById("voiceButton");

    const stopButton =
        document.getElementById("stopButton");

    const clearButton =
        document.getElementById("clearButton");

    const sendButton =
        document.getElementById("sendButton");

    const userInput =
        document.getElementById("userInput");

    const voiceToggle =
        document.getElementById("voiceToggle");

    const voiceSpeedInput =
        document.getElementById("voiceSpeed");

    const voiceLanguageInput =
        document.getElementById("voiceLanguage");

    const memoryToggle =
        document.getElementById("memoryToggle");

    const testVoiceButton =
        document.getElementById("testVoiceButton");

    const clearMemoryButton =
        document.getElementById("clearMemoryButton");


    /* SETTINGS */

    settingsBtn.addEventListener(
        "click",
        openSettings
    );


    closeSettingsBtn.addEventListener(
        "click",
        closeSettings
    );


    /* VOICE */

    voiceButton.addEventListener(
        "click",
        toggleVoice
    );


    stopButton.addEventListener(
        "click",
        stopSpeaking
    );


    /* CLEAR CHAT */

    clearButton.addEventListener(
        "click",
        clearChatOnly
    );


    /* SEND */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* ENTER KEY */

    userInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* SETTINGS CONTROLS */

    voiceToggle.addEventListener(
        "change",
        function () {

            voiceEnabled =
                voiceToggle.checked;

            saveSettings();

            updateVoiceButton();

        }
    );


    voiceSpeedInput.addEventListener(
        "input",
        function () {

            voiceSpeed =
                parseFloat(
                    voiceSpeedInput.value
                );

            document.getElementById(
                "voiceSpeedValue"
            ).textContent =
                voiceSpeed.toFixed(2) + "x";

            saveSettings();

        }
    );


    voiceLanguageInput.addEventListener(
        "change",
        function () {

            voiceLanguage =
                voiceLanguageInput.value;

            saveSettings();

        }
    );


    memoryToggle.addEventListener(
        "change",
        function () {

            memoryEnabled =
                memoryToggle.checked;

            saveSettings();

        }
    );


    testVoiceButton.addEventListener(
        "click",
        function () {

            speakText(
                "Hello! I am JARVIS. Your voice system is working."
            );

        }
    );


    clearMemoryButton.addEventListener(
        "click",
        function () {

            clearMemory();

        }
    );


    /* CLOSE SETTINGS WHEN TAPPING OUTSIDE */

    document
        .getElementById("settingsOverlay")
        .addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    this
                ) {

                    closeSettings();

                }

            }
        );

}


/* ================= WELCOME ================= */

function showWelcomeMessage() {

    const chatBox =
        document.getElementById("chatBox");

    if (chatBox.children.length > 0) {
        return;
    }

    addMessage(
        "jarvis",
        "Hello! I am JARVIS. 🤖\n\n" +
        "I am ready to help you.\n\n" +
        "Try:\n" +
        "• hello\n" +
        "• time\n" +
        "• date\n" +
        "• calculate 25*4\n" +
        "• google cats\n" +
        "• youtube music\n" +
        "• open google"
    );

}


/* ================= ADD MESSAGE ================= */

function addMessage(sender, text) {

    const chatBox =
        document.getElementById("chatBox");

    const message =
        document.createElement("div");

    message.className =
        "message " + sender;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    const time =
        document.createElement("div");

    time.className =
        "time";


    time.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    bubble.appendChild(time);

    message.appendChild(bubble);

    chatBox.appendChild(message);


    chatBox.scrollTop =
        chatBox.scrollHeight;

}


/* ================= TYPING ================= */

function showTyping() {

    hideTyping();

    const chatBox =
        document.getElementById("chatBox");


    const message =
        document.createElement("div");

    message.className =
        "message jarvis";

    message.id =
        "typingMessage";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    const typing =
        document.createElement("div");

    typing.className =
        "typing";


    typing.innerHTML =
        "<span></span><span></span><span></span>";


    bubble.appendChild(typing);

    message.appendChild(bubble);

    chatBox.appendChild(message);


    typingElement =
        message;


    chatBox.scrollTop =
        chatBox.scrollHeight;

}


function hideTyping() {

    const element =
        document.getElementById(
            "typingMessage"
        );

    if (element) {
        element.remove();
    }

    typingElement = null;

}


/* ================= SEND MESSAGE ================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "userInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    input.value = "";


    addMessage(
        "user",
        text
    );


    conversation.push({
        role: "user",
        text: text
    });


    saveConversation();


    /* LOCAL COMMAND */

    const localReply =
        await handleLocalCommand(text);


    if (localReply !== null) {

        addMessage(
            "jarvis",
            localReply
        );


        conversation.push({
            role: "assistant",
            text: localReply
        });


        saveConversation();


        speakText(localReply);


        return;
    }


    /* GEMINI */

    showTyping();


    try {

        const reply =
            await askGemini(text);


        hideTyping();


        addMessage(
            "jarvis",
            reply
        );


        conversation.push({
            role: "assistant",
            text: reply
        });


        saveConversation();


        speakText(reply);

    }

    catch (error) {

        hideTyping();

        console.error(error);


        const message =
            "Gemini error:\n\n" +
            error.message;


        addMessage(
            "jarvis",
            message
        );

    }

}


/* ================= GEMINI ================= */

async function askGemini(text) {

    if (
        !API_KEY ||
        API_KEY ===
        "PASTE_YOUR_GEMINI_API_KEY_HERE"
    ) {

        throw new Error(
            "Gemini API key is missing. " +
            "Add your API key near the top of index.html."
        );

    }


    const systemInstruction =
        "You are JARVIS, a friendly personal AI assistant. " +
        "Give clear, useful and concise answers. " +
        "The user is chatting from a mobile phone.";


    const recentConversation =
        conversation
            .slice(-10)
            .map(function (item) {

                return (
                    item.role +
                    ": " +
                    item.text
                );

            })
            .join("\n");


    const prompt =
    systemInstruction +
    "\n\nConversation:\n" +
    recentConversation +
    "\n\nUser: " +
    text +
    "\n\nJARVIS:";


const url =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    MODEL +
    ":generateContent";


const response = await fetch(
    url,
    {
        method: "POST",

        headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": API_KEY
        },

        body: JSON.stringify({
            contents: [
                {
                    parts: [
                        {
                            text: prompt
                        }
                    ]
                }
            ]
        })
    }
);


if (!response.ok) {

    const errorText =
        await response.text();

    throw new Error(
        "Gemini API error " +
        response.status +
        ": " +
        errorText
    );
}


const data =
    await response.json();


const reply =
    data?.candidates?.[0]?.content?.parts?.[0]?.text;


if (!reply) {

    throw new Error(
        "Gemini returned an empty response."
    );
}


return reply.trim();

}


/* ================= LOCAL COMMANDS ================= */

async function handleLocalCommand(text) {

    const original = text.trim();
    const command = original.toLowerCase();


    if (
        command === "hello" ||
        command === "hi" ||
        command === "hey jarvis"
    ) {
        return "Hello! I'm JARVIS. How can I help you?";
    }


    if (
        command.includes("how are you") ||
        command.includes("how r you")
    ) {
        return "I'm doing great and ready to help you.";
    }


    if (
        command.includes("who are you") ||
        command.includes("what are you")
    ) {
        return "I'm JARVIS, your personal AI assistant.";
    }


    /* TIME */

    if (
        command === "time" ||
        command.includes("what time is it") ||
        command.includes("current time")
    ) {

        return (
            "The current time is " +
            new Date().toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )
        );

    }


    /* DATE */

    if (
        command === "date" ||
        command.includes("today's date") ||
        command.includes("what is today's date")
    ) {

        return (
            "Today's date is " +
            new Date().toLocaleDateString(
                "en-IN",
                {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            )
        );

    }


    /* GOOGLE */

    if (command.startsWith("google ")) {

        const query =
            original.substring(7).trim();

        if (query) {

            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(query),
                "_blank"
            );

            return "Searching Google for " + query;
        }
    }


    /* YOUTUBE */

    if (command.startsWith("youtube ")) {

        const query =
            original.substring(8).trim();

        if (query) {

            window.open(
                "https://www.youtube.com/results?search_query=" +
                encodeURIComponent(query),
                "_blank"
            );

            return "Searching YouTube for " + query;
        }
    }


    /* OPEN GOOGLE */

    if (
        command === "google" ||
        command === "open google"
    ) {

        window.open(
            "https://www.google.com",
            "_blank"
        );

        return "Opening Google.";
    }


    /* OPEN YOUTUBE */

    if (
        command === "youtube" ||
        command === "open youtube"
    ) {

        window.open(
            "https://www.youtube.com",
            "_blank"
        );

        return "Opening YouTube.";
    }


    /* CALCULATOR */

    if (command.startsWith("calculate ")) {

        const expression =
            original.substring(10).trim();

        if (expression) {
            return calculateExpression(expression);
        }
    }


    /* DIRECT MATH */

    if (
        /^[0-9+\-*/().%\s]+$/.test(command)
    ) {

        return calculateExpression(command);

    }


    /* CLEAR */

    if (
        command === "clear" ||
        command === "clear chat"
    ) {

        clearChatOnly();

        return "Chat cleared.";
    }


    /* STOP */

    if (
        command === "stop" ||
        command === "stop speaking" ||
        command === "be quiet"
    ) {

        stopSpeaking();

        return "Voice stopped.";
    }


    return null;

}


/* ================= CALCULATOR ================= */

function calculateExpression(expression) {

    try {

        if (
            !/^[0-9+\-*/().%\s]+$/.test(expression)
        ) {

            return "I can only calculate basic mathematical expressions.";

        }


        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        if (
            typeof result !== "number" ||
            !Number.isFinite(result)
        ) {

            return "I couldn't calculate that.";

        }


        return expression + " = " + result;

    }

    catch (error) {

        return "I couldn't calculate that expression.";

    }

}


/* ================= MEMORY ================= */

function saveConversation() {

    if (!memoryEnabled) {
        return;
    }

    try {

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(
                conversation.slice(-50)
            )
        );

    }

    catch (error) {

        console.error(
            "Memory save failed:",
            error
        );

    }

}


function loadMemory() {

    try {

        const saved =
            localStorage.getItem(
                MEMORY_KEY
            );

        if (saved) {

            conversation =
                JSON.parse(saved);

        }

    }

    catch (error) {

        conversation = [];

        console.error(
            "Memory load failed:",
            error
        );

    }

}


function clearMemory() {

    localStorage.removeItem(
        MEMORY_KEY
    );

    conversation = [];

    addMessage(
        "jarvis",
        "JARVIS memory has been cleared."
    );

}


/* ================= CLEAR CHAT ================= */

function clearChatOnly() {

    const chatBox =
        document.getElementById(
            "chatBox"
        );

    chatBox.innerHTML = "";

    showWelcomeMessage();

}


/* ================= VOICE ================= */

function toggleVoice() {

    voiceEnabled =
        !voiceEnabled;

    saveSettings();

    updateVoiceButton();

    if (!voiceEnabled) {
        stopSpeaking();
    }

}


function updateVoiceButton() {

    const button =
        document.getElementById(
            "voiceButton"
        );

    if (voiceEnabled) {

        button.textContent =
            "🔊 Voice ON";

    } else {

        button.textContent =
            "🔇 Voice OFF";

    }

}


/* ================= SPEECH ================= */

function speakText(text) {

    if (!voiceEnabled) {
        return;
    }


    if (!("speechSynthesis" in window)) {

        return;

    }


    stopSpeaking();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        voiceLanguage;

    utterance.rate =
        voiceSpeed;

    utterance.pitch =
        1;


    window.speechSynthesis.speak(
        utterance
    );

}


function stopSpeaking() {

    if (
        "speechSynthesis" in window
    ) {

        window.speechSynthesis.cancel();

    }

}


/* ================= SETTINGS ================= */

function openSettings() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.add("show");

}


function closeSettings() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.remove("show");

}


/* ================= SAVE SETTINGS ================= */

function saveSettings() {

    const settings = {

        voiceEnabled:
            voiceEnabled,

        voiceSpeed:
            voiceSpeed,

        voiceLanguage:
            voiceLanguage,

        memoryEnabled:
            memoryEnabled

    };


    localStorage.setItem(
        "jarvisSettings",
        JSON.stringify(settings)
    );

}


/* ================= LOAD SETTINGS ================= */

function loadSettings() {

    try {

        const saved =
            localStorage.getItem(
                "jarvisSettings"
            );


        if (saved) {

            const settings =
                JSON.parse(saved);


            if (
                typeof settings.voiceEnabled ===
                "boolean"
            ) {

                voiceEnabled =
                    settings.voiceEnabled;

            }


            if (
                typeof settings.voiceSpeed ===
                "number"
            ) {

                voiceSpeed =
                    settings.voiceSpeed;

            }


            if (
                typeof settings.voiceLanguage ===
                "string"
            ) {

                voiceLanguage =
                    settings.voiceLanguage;

            }


            if (
                typeof settings.memoryEnabled ===
                "boolean"
            ) {

                memoryEnabled =
                    settings.memoryEnabled;

            }

        }

    }

    catch (error) {

        console.error(
            "Settings load failed:",
            error
        );

    }


    document.getElementById(
        "voiceToggle"
    ).checked =
        voiceEnabled;


    document.getElementById(
        "voiceSpeed"
    ).value =
        voiceSpeed;


    document.getElementById(
        "voiceSpeedValue"
    ).textContent =
        voiceSpeed.toFixed(2) + "x";


    document.getElementById(
        "voiceLanguage"
    ).value =
        voiceLanguage;


    document.getElementById(
        "memoryToggle"
    ).checked =
        memoryEnabled;


    updateVoiceButton();

}


/* ================= ERROR HANDLING ================= */

window.addEventListener(
    "error",
    function (event) {

        console.error(
            "JARVIS ERROR:",
            event.error || event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function (event) {

        console.error(
            "JARVIS PROMISE ERROR:",
            event.reason
        );

    }
);


/* ================= STARTUP TEST ================= */

console.log(
    "JARVIS is running successfully."
);

</script>
